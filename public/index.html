<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responder Convite 💖</title>
    <style>
        :root {
            --primary: #ff4b5c;
            --primary-hover: #ff2a3f;
            --bg: #fff5f6;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --whatsapp: #25d366;
            --whatsapp-hover: #1ebd58;
            --calendar: #3182ce;
            --calendar-hover: #2b6cb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 75, 92, 0.1);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-light);
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* Mecânica de Passos */
        .passo {
            display: none;
        }

        .passo.ativo {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grid de Opções Clássicas (Única Escolha) */
        .grid-opcoes {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn-opcao {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            text-align: center;
        }

        .btn-opcao:hover {
            border-color: var(--primary);
            background: #fff5f6;
        }

        /* Estilização Customizada para Múltipla Escolha (Checkboxes) */
        .lista-checkbox {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .item-checkbox {
            display: flex;
            align-items: center;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .item-checkbox input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .item-checkbox:has(input:checked) {
            border-color: var(--primary);
            background: #fff5f6;
        }

        /* Botões de Ação Global */
        .btn-acao {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-proximo {
            background-color: var(--primary);
            color: white;
        }

        .btn-proximo:hover {
            background-color: var(--primary-hover);
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: white;
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
        }

        .btn-agenda {
            background-color: var(--calendar);
            color: white;
        }

        .btn-agenda:hover {
            background-color: var(--calendar-hover);
        }

        /* Resumo Final */
        .resumo-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 15px;
            line-height: 1.6;
        }

        .resumo-box strong {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="titulo-convite">Carregando convite...</h1>
        <p class="subtitle" id="sub-titulo">Aguarde um momento</p>

        <div id="passo-data" class="passo">
            <div class="grid-opcoes">
                <button class="btn-opcao" onclick="selecionarOpcao('date', 'Sexta-feira')">📅 Sexta-feira</button>
                <button class="btn-opcao" onclick="selecionarOpcao('date', 'Sábado')">📅 Sábado</button>
                <button class="btn-opcao" onclick="selecionarOpcao('date', 'Domingo')">📅 Domingo</button>
            </div>
        </div>

        <div id="passo-hora" class="passo">
            <div class="grid-opcoes">
                <button class="btn-opcao" onclick="selecionarOpcao('time', '12:00h (Almoço)')">☀️ 12:00h (Almoço)</button>
                <button class="btn-opcao" onclick="selecionarOpcao('time', '16:00h (Tarde)')">⛅ 16:00h (Tarde)</button>
                <button class="btn-opcao" onclick="selecionarOpcao('time', '20:00h (Jantar)')">🌙 20:00h (Jantar)</button>
            </div>
        </div>

        <div id="passo-comida" class="passo">
            <div class="grid-opcoes">
                <button class="btn-opcao" onclick="selecionarOpcao('food', 'Pizza')">🍕 Pizza</button>
                <button class="btn-opcao" onclick="selecionarOpcao('food', 'Hambúrguer')">🍔 Hambúrguer</button>
                <button class="btn-opcao" onclick="selecionarOpcao('food', 'Comida Japonesa')">🍣 Comida Japonesa</button>
                <button class="btn-opcao" onclick="selecionarOpcao('food', 'Massa/Italiana')">🍝 Massa/Italiana</button>
            </div>
        </div>

        <div id="passo-atividade" class="passo">
            <div class="lista-checkbox">
                <label class="item-checkbox">
                    <input type="checkbox" name="atividade" value="Cinema"> 🎬 Cinema
                </label>
                <label class="item-checkbox">
                    <input type="checkbox" name="atividade" value="Assistir Filme/Série em Casa"> 🍿 Filme em Casa
                </label>
                <label class="item-checkbox">
                    <input type="checkbox" name="atividade" value="Jogar Jogos de Tabuleiro"> 🎲 Jogos de Tabuleiro
                </label>
                <label class="item-checkbox">
                    <input type="checkbox" name="atividade" value="Dar um passeio a pé"> 🌳 Passeio ao Ar Livre
                </label>
                <label class="item-checkbox">
                    <input type="checkbox" name="atividade" value="Ficar conversando"> 💬 Só ficar conversando
                </label>
            </div>
            <button class="btn-acao btn-proximo" onclick="avancarAtividades()">Avançar ➡️</button>
        </div>

        <div id="passo-final" class="passo">
            <div class="resumo-box" id="resumo-escolhas"></div>
            <button class="btn-acao btn-whatsapp" id="btn-whatsapp" onclick="confirmarWhatsApp()">💬 Confirmar no WhatsApp</button>
            <button class="btn-acao btn-agenda" style="margin-top: 12px;" onclick="salvarNaAgenda()">🗓️ Salvar no Calendário (Opcional)</button>
        </div>
    </div>

    <script>
        // Função Robusta para capturar o ID da URL em qualquer formato ou estrutura do Render
        function obterIdConvite() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('id')) {
                return urlParams.get('id');
            }
            const caminhos = window.location.pathname.split('/').filter(Boolean);
            if (caminhos.length > 0) {
                const ultimoSegmento = caminhos[caminhos.length - 1];
                if (ultimoSegmento.includes('.html')) {
                    return caminhos[caminhos.length - 2];
                }
                return ultimoSegmento;
            }
            return null;
        }

        const idConvite = obterIdConvite();

        // Estado das escolhas do convidado
        let nomeCriador = "";
        let whatsappCriador = "";
        let escolhas = {
            date: "",
            time: "",
            food: "",
            activity: ""
        };

        // Carrega as informações iniciais do banco de dados ao abrir a página
        async function carregarConvite() {
            try {
                if (!idConvite) {
                    console.error("ID do convite não encontrado na URL atual.");
                    throw new Error("ID ausente");
                }

                console.log("Buscando dados no banco para o ID:", idConvite);
                const response = await fetch(`/api/convite/${idConvite}`);
                if (!response.ok) throw new Error("Registro não localizado no MongoDB");
                
                const dados = await response.json();
                nomeCriador = dados.nomeCriador;
                
                // Adapta os títulos com o nome de quem convidou
                document.getElementById('titulo-convite').innerText = `Convite de ${nomeCriador} ✨`;
                document.getElementById('sub-titulo').innerText = "Escolha o melhor dia para vocês:";
                
                // Ativa o primeiro passo (Data)
                mostrarPasso('passo-data');
            } catch (err) {
                console.error("Erro no processamento do convite:", err);
                document.getElementById('titulo-convite').innerText = "Erro 😢";
                document.getElementById('sub-titulo').innerText = "Convite não encontrado ou link inválido.";
            }
        }

        // Controla a troca visual dos passos
        function mostrarPasso(idPasso) {
            document.querySelectorAll('.passo').forEach(p => p.classList.remove('ativo'));
            document.getElementById(idPasso).classList.add('ativo');
        }

        // Trata a seleção das telas de clique único (Data, Hora, Comida)
        function selecionarOpcao(campo, valor) {
            bytescolhas = escolhas; // Mantém compatibilidade interna de contexto
            escolhas[campo] = valor;

            if (campo === 'date') {
                document.getElementById('sub-titulo').innerText = "Qual o melhor horário?";
                mostrarPasso('passo-hora');
            } else if (campo === 'time') {
                document.getElementById('sub-titulo').innerText = "O que prefere comer?";
                mostrarPasso('passo-comida');
            } else if (campo === 'food') {
                document.getElementById('sub-titulo').innerText = "O que vamos fazer? (Selecione quantas quiser)";
                mostrarPasso('passo-atividade');
            }
        }

        // Processa o passo de múltipla escolha das atividades
        function avancarAtividades() {
            const checkboxes = document.querySelectorAll('input[name="atividade"]:checked');
            const selecionadas = Array.from(checkboxes).map(cb => cb.value);

            if (selecionadas.length === 0) {
                alert("Por favor, selecione pelo menos uma atividade! 😊");
                return;
            }

            // Junta as opções selecionadas com uma vírgula ("Cinema, Filme em Casa")
            escolhas.activity = selecionadas.join(', ');

            // Envia tudo para o backend salvar e liberar a tela de finalização
            finalizarRespostas();
        }

        // Envia as respostas finais para o servidor
        async function finalizarRespostas() {
            try {
                const response = await fetch(`/api/salvar-date/${idConvite}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(escolhas)
                });

                const dados = await response.json();
                if (dados.sucesso) {
                    whatsappCriador = dados.whatsappCriador;
                    montarTelaFinal();
                } else {
                    alert("Erro ao salvar suas opções.");
                }
            } catch (err) {
                alert("Erro na comunicação com o servidor.");
            }
        }

        // Monta o resumo visual na última tela
        function montarTelaFinal() {
            document.getElementById('sub-titulo').innerText = "Tudo pronto! Veja o resumo do seu Date:";
            
            const resumoHTML = `
                📌 <strong>Dia:</strong> ${escolhas.date}<br>
                ⏰ <strong>Hora:</strong> ${escolhas.time}<br>
                🍕 <strong>Comida:</strong> ${escolhas.food}<br>
                🎬 <strong>Atividades:</strong> ${escolhas.activity}
            `;
            
            document.getElementById('resumo-escolhas').innerHTML = resumoHTML;
            mostrarPasso('passo-final');
        }

        // Monta o link do WhatsApp com a mensagem pronta e redireciona
        function confirmarWhatsApp() {
            const mensagem = `Oi ${nomeCriador}! Já respondi o seu convite do Date customizado! ✨\n\n` +
                             `📅 Dia: ${escolhas.date}\n` +
                             `⏰ Horário: ${escolhas.time}\n` +
                             `🍕 Para comer: ${escolhas.food}\n` +
                             `🎬 O que fazer: ${escolhas.activity}\n\n` +
                             `Fechado? Vamos nos falando! 🥰`;

            // Remove caracteres especiais do número do WhatsApp para o link funcionar perfeitamente
            const numeroLimpo = whatsappCriador.replace(/\D/g, '');
            const urlWhatsapp = `https://wa.me/${numeroLimpo}?text=${encodeURIComponent(mensagem)}`;
            
            window.open(urlWhatsapp, '_blank');
        }

        // Gera o arquivo .ics de calendário de forma dinâmica e inicia o download direto no celular
        function salvarNaAgenda() {
            const tituloEvento = `Date com ${nomeCriador} 💖`;
            const descricaoEvento = `Cardápio: ${escolhas.food} | Atividades planejadas: ${escolhas.activity}`;
            
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            
            const horaLimpa = escolhas.time.replace(/\D/g, '').substring(0, 4) || "2000";
            const dataFmt = `${ano}${mes}${dia}T${horaLimpa}00`;

            const icsConteudo = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Nosso Date Custom//BR",
                "BEGIN:VEVENT",
                `DTSTART:${dataFmt}`,
                `DTEND:${dataFmt}`,
                `SUMMARY:${tituloEvento}`,
                `DESCRIPTION:${descricaoEvento}`,
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");

            const blob = new Blob([icsConteudo], { type: "text/calendar;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "lembrete-do-date.ics";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Inicializa o app ao carregar a página
        carregarConvite();
    </script>
</body>
</html>
