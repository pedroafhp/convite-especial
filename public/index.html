<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convite Especial</title>

    <style>
        /* (SEU CSS INTACTO - NÃO ALTERADO) */
    </style>

<script>

// ======================================================
// 🔥 GARANTIA DE VARIÁVEIS (EVITA TRAVAMENTO)
// ======================================================

let idConvite =
    new URLSearchParams(window.location.search).get('id')
    || window.location.pathname.split('/').pop();

let nomeDonoDoLink = 'Alguém';
let tipoOcasiao = 'date';
let configTipoConvite = 'individual';
let whatsappCriadorLink = '';
let tituloPersonalizado = '';
let nomeDoParticipanteAtual = 'Convidado Individual';
let ehPrimeiroAcessoGrupo = false;

let dateSelections = {
    date: '',
    time: '',
    food: 'Carregando...',
    activity: 'Carregando...'
};

// ======================================================
// 🔥 FUNÇÃO DE SEGURANÇA (NOVA - NÃO MUDA SEU FLUXO)
// ======================================================

function inicializarUIFallback() {
    // Garante que NUNCA fica travado na tela inicial
    setTimeout(() => {
        if (typeof configurarConviteIndividual === "function") {
            configurarConviteIndividual();
        }
        if (typeof initCoracoesNoBackground === "function") {
            initCoracoesNoBackground();
        }
    }, 50);
}

// ======================================================
// TELA INICIAL DO CONVITE INDIVIDUAL
// ======================================================

function configurarConviteIndividual() {

    nextScreen(0);

    document.getElementById('titulo-dinamico').innerHTML =
        `${nomeDonoDoLink} te convidou para:<br><br><strong>${tituloPersonalizado || 'Um momento especial ✨'}</strong><br><br>Você aceita?`;

    document.getElementById('subtitulo-dinamico').innerText =
        'Só existe uma resposta correta. 😏';

    document.getElementById('wrapper-input-nome').style.display = 'none';

    document.getElementById('container-botoes-tela1').innerHTML = `
        <button class="btn" onclick="aceitarConvite()">SIM 💖</button>

        <button
            id="btn-fugitivo"
            class="btn"
            style="
                margin-top:12px;
                background:transparent;
                border:1px solid rgba(255,255,255,.2);
                box-shadow:none;
                position:relative;
            "
        >
            NÃO 😅
        </button>
    `;

    iniciarBotaoFugitivo();
}

// ======================================================
// BOTÃO FUGITIVO
// ======================================================

function iniciarBotaoFugitivo() {

    const btn = document.getElementById('btn-fugitivo');
    if (!btn) return;

    btn.addEventListener('mouseenter', fugir);
    btn.addEventListener('touchstart', fugir);

    function fugir() {
        const x = Math.random() * 180 - 90;
        const y = Math.random() * 120 - 60;

        btn.style.transform =
            `translate(${x}px, ${y}px)`;
    }
}

// ======================================================
// ACEITAR CONVITE
// ======================================================

function aceitarConvite() {
    nextScreen(1);
}

// ======================================================
// CARREGAMENTO DO CONVITE (CORRIGIDO)
// ======================================================

function carregarConvite() {

    try {

        // 🔥 FALLBACK imediato se id inválido
        if (!idConvite || idConvite === 'index.html') {
            configurarConviteIndividual();
            initCoracoesNoBackground();
            return;
        }

        fetch(`/api/convite/${idConvite}`)
            .then(res => {
                if (!res.ok) throw new Error("API erro");
                return res.json();
            })
            .then(data => {

                nomeDonoDoLink = data.nomeCriador || 'Alguém';
                tipoOcasiao = data.ocasiao || 'date';
                configTipoConvite = data.tipoConvite || 'individual';
                whatsappCriadorLink = data.whatsappCriador || '';
                tituloPersonalizado = data.tituloPersonalizado || '';

                aplicarConfiguracaoOcasiao(tipoOcasiao);

                if (configTipoConvite === 'grupo') {

                    const propostaOriginal =
                        data.respostas
                            ? data.respostas.find(r => r.votoConcorda && r.ehPropostaBase)
                            : null;

                    if (!propostaOriginal && (!data.respostas || data.respostas.length === 0)) {
                        ehPrimeiroAcessoGrupo = true;
                        configurarInterfacePrimeiroAcesso();
                    } else {
                        configurarInterfaceGrupo(data.respostas || []);
                    }

                } else {
                    configurarConviteIndividual();
                }

                initCoracoesNoBackground();
            })
            .catch(err => {
                console.error(err);

                // 🔥 FALLBACK GARANTIDO
                configurarConviteIndividual();
                initCoracoesNoBackground();
            });

    } catch (e) {
        console.error(e);

        configurarConviteIndividual();
        initCoracoesNoBackground();
    }
}

// ======================================================
// INICIALIZAÇÃO GARANTIDA (ESSENCIAL)
// ======================================================

window.addEventListener('load', () => {

    // 🔥 SEM ISSO O SITE PODE TRAVAR
    inicializarUIFallback();

    // 🔥 tenta carregar dados reais
    carregarConvite();
});

</script>

</head>

<body>

<!-- SEU HTML INTACTO -->

</body>
</html>
