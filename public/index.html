<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite Especial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b020f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            color: #ffffff;
            overflow: hidden;
            padding: 10px;
        }

        .phone-container {
            width: 100%;
            max-width: 390px;
            height: 85vh;
            height: 85dvh;
            max-height: 780px;
            background: radial-gradient(circle at center, #20082c 0%, #07020a 100%);
            border-radius: 40px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 4px solid rgba(255, 255, 255, 0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px 20px 20px;
        }

        @media (max-width: 450px) {
            body { padding: 0; }
            .phone-container {
                max-width: 100%;
                height: 100vh;
                height: 100dvh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
        }

        .notch {
            position: absolute;
            top: 12px;
            width: 110px;
            height: 25px;
            background-color: #000000;
            border-radius: 20px;
            z-index: 10;
        }

        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart-icon {
            position: absolute;
            color: rgba(255, 42, 109, 0.15);
            animation: floatUp 7s infinite linear;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-800px) rotate(360deg); opacity: 0; }
        }

        .header-emojis {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
            z-index: 2;
        }

        .emoji-glow {
            font-size: 60px;
            line-height: 1;
            filter: drop-shadow(0 0 20px rgba(255, 42, 109, 0.6));
        }

        .main-card {
            background: rgba(19, 7, 27, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 42, 109, 0.15);
            border-radius: 28px;
            width: 100%;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 2;
            text-align: center;
            margin-bottom: auto;
        }

        .main-card h2 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Classes de apoio das telas do seu fluxo */
        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        .screen.active {
            display: flex;
        }

        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 42, 109, 0.2);
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            text-align: center;
            margin-top: 15px;
        }

        .btn-next {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(90deg, #ff2a6d 0%, #9b00e8 100%);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Customização dos botões injetados dinamicamente para manter o layout idêntico */
        #container-botoes-votacao {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }
        .btn-vote-sim, .btn-vote-nao {
            flex: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.1s ease;
        }
        .btn-vote-sim:active, .btn-vote-nao:active {
            transform: scale(0.95);
        }

        .group-responses {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
            text-align: left;
            margin-top: 15px;
        }

        .group-title {
            font-size: 11px;
            font-weight: 700;
            color: #8f799c;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .response-list {
            max-height: 120px;
            overflow-y: auto;
        }

        .response-item, .voto-linha {
            font-size: 13px;
            color: #e5daf0;
            line-height: 1.4;
        }

        .footer-text {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
            margin-top: 15px;
        }

        /* Customizações adicionais para as telas de seleção gastronômica e vibes */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        .option-box {
            background: rgba(36, 18, 49, 0.4);
            border: 1px solid rgba(255, 42, 109, 0.15);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .option-box.selected {
            background: rgba(255, 42, 109, 0.3);
            border-color: #ff2a6d;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="notch"></div>
        <div class="hearts-bg" id="hearts-bg"></div>

        <div class="header-emojis">
            <div class="emoji-glow" id="emoji-tela1">🍿</div>
            <div class="emoji-glow" id="emoji-tela2">💖</div>
        </div>

        <div class="screen active" id="screen-0">
            <div class="main-card">
                <h2 id="titulo-dinamico">Carregando convite...</h2>
                <input type="text" id="nome-participante-input" class="input-field" placeholder="Digite seu nome aqui...">
                <div id="container-botoes-tela1">
                    </div>
                
                <div class="group-responses" id="lista-outros-votos" style="display: none;">
                    <div class="group-title">Respostas do Grupo:</div>
                    <div class="response-list" id="linhas-votos-box"></div>
                </div>
            </div>
        </div>

        <div class="screen" id="screen-2">
            <div class="main-card">
                <h2 id="titulo-tela2">E AÍ?</h2>
                
                <div id="subtitulo-tela2">Carregando detalhes da proposta...</div>
                
                <div id="wrapper-votacao-grupo" style="display: none;">
                    <div id="container-botoes-votacao">
                        </div>
                </div>

                <button id="btn-avancar-fluxo-padrao" class="btn-next" onclick="nextScreen(3)">Avançar</button>
            </div>
        </div>

        <div class="screen" id="screen-3">
            <div class="main-card">
                <h2 id="titulo-tela3">Escolha a Data</h2>
                <input type="date" id="date-input" class="input-field">
                <input type="time" id="time-input" class="input-field" style="margin-top: 10px;">
                <button class="btn-next" onclick="validateScreen3()">Confirmar Data 📅</button>
            </div>
        </div>

        <div class="screen" id="screen-4">
            <div class="main-card">
                <h2 id="titulo-tela4">O que comer?</h2>
                <div class="options-grid" id="grid-comida"></div>
                <div id="campo-outros-comida" style="display: none;">
                    <input type="text" id="comida-outros-input" class="input-field" placeholder="O que você sugere?">
                </div>
                <button class="btn-next" onclick="validateScreen4()">Avançar 🚀</button>
            </div>
        </div>

        <div class="screen" id="screen-5">
            <div class="main-card">
                <h2 id="titulo-tela5">Qual a vibe?</h2>
                <div class="options-grid" id="grid-atividade"></div>
                <div id="campo-outros-vibe" style="display: none;">
                    <input type="text" id="vibe-outros-input" class="input-field" placeholder="Qual a sua ideia?">
                </div>
                <button class="btn-next" onclick="validateScreen5()">Ver Resumo 🗺️</button>
            </div>
        </div>

        <div class="screen" id="screen-6">
            <div class="main-card">
                <div style="font-size: 50px; margin-bottom: 10px;" id="emoji-final">🎉</div>
                <h2 id="titulo-final">Tudo Pronto!</h2>
                <p id="subtitulo-final" style="font-size: 13px; color: #bfaec6; margin-bottom: 15px;"></p>
                
                <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; text-align: left; font-size: 13px; margin-bottom: 15px;">
                    📅 Data: <span id="sum-date" style="color: #ff2a6d; font-weight: bold;"></span><br>
                    ⏰ Horário: <span id="sum-time" style="color: #ff2a6d; font-weight: bold;"></span><br>
                    🍕 Cardápio: <span id="sum-food" style="color: #ff2a6d; font-weight: bold;"></span><br>
                    🎸 Vibe: <span id="sum-activity" style="color: #ff2a6d; font-weight: bold;"></span>
                </div>

                <div id="status-texto" style="font-size: 11px; color: #ff2a6d; margin-bottom: 10px; font-weight: bold;"></div>
                <button class="btn-next" onclick="enviarDadosBackend()">Confirmar e Enviar no WhatsApp 🚀</button>
                <button class="btn-next" onclick="criarEventoAgenda()" style="background: #250f31; margin-top: 8px; border: 1px solid rgba(255,42,109,0.2)">Salvar na Agenda 📅</button>
            </div>
        </div>

        <div class="footer-text">Interaja para avançar</div>
    </div>

    <script>
        let selectedFoods = [];        
        let selectedActivities = [];   
        let dateSelections = { date: '', time: '', food: '', activity: '' }; 
        let tipoOcasiao = 'date';      
        let nomeDonoDoLink = 'Alguém'; 
        let whatsappCriadorLink = '';
        
        let configTipoConvite = 'individual'; 
        let nomeDoParticipanteAtual = '';

        let propostaPrincipalSalva = null; 
        let ehPrimeiroAcessoGrupo = false;

        const configuracoesOcasiao = {
            'date': {
                tituloTela1: "te chamou para um date! Você aceitaria?",
                emojiTela1: "🥺", emojiTela2: "😏🌹",
                tituloTela2: "Você disse sim? 🥺", subtituloTela2: "Eu estava esperando você dizer não kkkk",
                tituloTela4: "O que está afim de comer? 🤔",
                tituloTela5: "Qual é a vibe do encontro? ✨",
                emojiFinal: "🐧🕶️🌹", tituloFinal: "Tô contigo! 💙", subtituloFinal: "Prepara a roupa que eu passo aí 🚗",
                textoWhats: "Aceitei o seu convite de date!",
                comidas: [
                    {icon: '🍔', label: 'Hambúrguer'}, {icon: '🍣', label: 'Sushi'}, {icon: '🍝', label: 'Massas'},
                    {icon: '🍕', label: 'Pizza'}, {icon: '🍸', label: 'Drinks'}, {icon: '🍽️', label: 'Outros'}
                ],
                atividades: [
                    {icon: '🍻', label: 'Barzinho'}, {icon: '🎬', label: 'Cinema'}, {icon: '☕', label: 'Café/Doceria'},
                    {icon: '🎸', label: 'Show/Stand-up'}, {icon: '🕯️', label: 'Jantar'}, {icon: '✨', label: 'Outros'}
                ]
            },
            'resenha': {
                tituloTela1: "está armando uma resenha! Bora encostar?",
                emojiTela1: "😎🔥", emojiTela2: "🍻🔥",
                tituloTela2: "Aeeee, confirmado! 🚀", subtituloTela2: "Veja abaixo os detalhes ou vote nas opções!",
                tituloTela4: "O que vamos comer/beber? 🍻",
                tituloTela5: "Qual vai ser a programação? 🎲",
                emojiFinal: "⚡🎸🤠", tituloFinal: "Rolê Confirmadíssimo! 🔥", subtituloFinal: "Garante o seu consumo e bora!",
                textoWhats: "Confirmei minha presença na resenha!",
                comidas: [
                    {icon: '🥩', label: 'Churrasco'}, {icon: '🍕', label: 'Pizza'}, {icon: '🍻', label: 'Cerveja/Drinks'},
                    {icon: '🍔', label: 'Hambúrguer'}, {icon: '🍿', label: 'Petiscos'}, {icon: '🍽️', label: 'Outros'}
                ],
                atividades: [
                    {icon: '🔊', label: 'Ouvir Som'}, {icon: '🎮', label: 'Jogar Videogame'}, {icon: '🃏', label: 'Jogos de Cartas'},
                    {icon: '⚽', label: 'Assistir Jogo'}, {icon: '🗣️', label: 'Só Fofocar'}, {icon: '✨', label: 'Outros'}
                ]
            },
            'girls-night': {
                tituloTela1: "te chamou para a Noite das Meninas! Vamos?",
                emojiTela1: "💅✨", emojiTela2: "🍿💖",
                tituloTela2: "Gostamos assim! ✨👭", subtituloTela2: "A fofoca vai ser longa! Participe da decisão abaixo:",
                tituloTela4: "Qual vai ser o cardápio? 🍫",
                tituloTela5: "Qual vai ser a nossa vibe? 💆‍♀️",
                emojiFinal: "💅🥂👑", tituloFinal: "Noite das Garotas! 💖", subtituloFinal: "Vem de pijama ou look babado!",
                textoWhats: "Presença confirmadíssima na Noite das Meninas! 💅",
                comidas: [
                    {icon: '🍕', label: 'Pizza'}, {icon: '🍫', label: 'Doces/Chocolates'}, {icon: '🍣', label: 'Sushi'},
                    {icon: '🥂', label: 'Vinho/Drinks'}, {icon: '🍿', label: 'Pipoca'}, {icon: '🍽️', label: 'Outros'}
                ],
                atividades: [
                    {icon: '🗣️', label: 'Fofocar Muito'}, {icon: '🎬', label: 'Filme/Série'}, {icon: '💆‍♀️', label: 'Skin Care/Make'},
                    {icon: '📸', label: 'Sessão de Fotos'}, {icon: '🎤', label: 'Karaokê'}, {icon: '✨', label: 'Outros'}
                ]
            },
            'outros': {
                tituloTela1: "te enviou um convite para um rolê especial! Topa?",
                emojiTela1: "🚀✨", emojiTela2: "✌️😎",
                tituloTela2: "Aí sim! Rolê aceito. 🙌", subtituloTela2: "Vamos alinhar a melhor dinâmica para todos!",
                tituloTela4: "O que seria bom comer? 😋",
                tituloTela5: "Qual é o plano principal? 🗺️",
                emojiFinal: "🌟🚀🎯", tituloFinal: "Tudo Certo! 🗺️", subtituloFinal: "Combinado, nos vemos em breve!",
                textoWhats: "Aceitei seu convite para o rolê!",
                comidas: [
                    {icon: '🍔', label: 'Hambúrguer'}, {icon: '🍕', label: 'Pizza'}, {icon: '🍦', label: 'Sorvete/Açaí'},
                    {icon: '🍽️', label: 'Restaurante'}, {icon: '🍿', label: 'Besteiras'}, {icon: '🍽️', label: 'Outros'}
                ],
                atividades: [
                    {icon: '🌳', label: 'Parque/Passeio'}, {icon: '🛍️', label: 'Shopping'}, {icon: '🎳', label: 'Jogar Boliche'},
                    {icon: '☕', label: 'Passar num Café'}, {icon: '🏠', label: 'Rolê Caseiro'}, {icon: '✨', label: 'Outros'}
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const idConvite = urlParams.get('id');

        if (idConvite) {
            fetch(`/api/convite/${idConvite}`)
                .then(res => res.json())
                .then(data => {
                    if (data.nomeCriador) {
                        nomeDonoDoLink = data.nomeCriador; 
                        tipoOcasiao = data.ocasiao || 'date'; 
                        configTipoConvite = data.tipoConvite || 'grupo';
                        whatsappCriadorLink = data.whatsappCriador || '';
                        
                        aplicarConfiguracaoOcasiao(tipoOcasiao);
                        
                        if (configTipoConvite === 'grupo') {
                            const propostaOriginal = data.respostas ? data.respostas.find(r => r.votoConcorda === true && r.ehPropostaBase === true) : null;
                            
                            if (!propostaOriginal && (!data.respostas || data.respostas.length === 0)) {
                                ehPrimeiroAcessoGrupo = true;
                                configurarInterfacePrimeiroAcesso();
                            } else {
                                propostaPrincipalSalva = propostaOriginal || data.respostas[0];
                                configurarInterfaceGrupo(data.respostas || []);
                            }
                        } else {
                            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                            document.getElementById('screen-0').classList.add('active');
                        }
                    }
                }).catch(err => {
                    console.error("Erro ao carregar dados do convite:", err);
                    aplicarConfiguracaoOcasiao('date');
                });
        } else {
            aplicarConfiguracaoOcasiao('date');
        }

        function nextScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const targetScreen = document.getElementById(`screen-${screenNum}`);
            if (targetScreen) targetScreen.classList.add('active');
        }

        function configurarInterfacePrimeiroAcesso() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-0').classList.add('active');
            document.getElementById('titulo-dinamico').innerText = `Seja bem-vindo! Você é o primeiro a chegar. Insira seu nome para criar a sugestão inicial do grupo!`;
            document.getElementById('container-botoes-tela1').innerHTML = `
                <button class="btn-next" onclick="salvarNomeParticipante()">Criar Proposta Inicial 🗓️</button>
            `;
            document.getElementById('lista-outros-votos').style.display = 'none';
        }

        function configurarInterfaceGrupo(respostasAnteriores) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-0').classList.add('active');
            document.getElementById('titulo-dinamico').innerText = `${nomeDonoDoLink} está organizando um rolê! Informe seu nome para ver a proposta e votar.`;
            document.getElementById('container-botoes-tela1').innerHTML = `
                <button class="btn-next" onclick="salvarNomeParticipante()">Ver Detalhes / Responder 🗓️</button>
            `;

            if (respostasAnteriores.length > 0) {
                document.getElementById('lista-outros-votos').style.display = 'block';
                const linhasContainer = document.getElementById('linhas-votos-box');
                linhasContainer.innerHTML = '';
                
                respostasAnteriores.forEach(voto => {
                    if (voto.ocultarNaLista) return;
                    const statusIcon = voto.votoConcorda ? '✅ Concordou' : '🔄 Contraproposta';
                    
                    let detalhe = '';
                    if (voto.votoConcorda) {
                        detalhe = 'Aprovou a sugestão principal';
                    } else {
                        const dLegivel = voto.date ? voto.date.split('-').reverse().join('/') : '--/--/----';
                        detalhe = `<br>📅 Sugeriu: ${dLegivel} às ${voto.time || '--:--'}<br>🍕 Rangos: ${voto.food || '--'}<br>🎸 Vibes: ${voto.activity || '--'}`;
                    }
                    
                    const div = document.createElement('div');
                    div.className = 'voto-linha';
                    div.style.borderBottom = '1px solid #3d2b45';
                    div.style.padding = '8px 0';
                    div.innerHTML = `<strong>${voto.nomeParticipante}</strong> (${statusIcon}): <span style="color:#d1c1d9">${detalhe}</span>`;
                    linhasContainer.appendChild(div);
                });
            }
        }

        function salvarNomeParticipante() {
            const nomeInput = document.getElementById('nome-participante-input').value.trim();
            if (!nomeInput) {
                alert('Escreva seu nome para podermos continuar!');
                return;
            }
            nomeDoParticipanteAtual = nomeInput;

            // CORREÇÃO: Direciona o fluxo individual direto para o passo a passo (Tela 3)
            if (configTipoConvite === 'individual') {
                nextScreen(3); 
            } else if (ehPrimeiroAcessoGrupo) {
                nextScreen(3); 
            } else {
                proseguirGrupoComVoto();
            }
        }

        function proseguirGrupoComVoto() {
            nextScreen(2);
            document.getElementById('wrapper-votacao-grupo').style.display = 'block';
            document.getElementById('btn-avancar-fluxo-padrao').style.display = 'none';
            document.getElementById('titulo-tela2').innerText = `E AÍ, ${nomeDoParticipanteAtual.toUpperCase()}?`;
            
            if (propostaPrincipalSalva) {
                const dFormat = propostaPrincipalSalva.date ? propostaPrincipalSalva.date.split('-').reverse().join('/') : '';
                document.getElementById('subtitulo-tela2').innerHTML = `
                    <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 14px; margin-bottom: 15px; text-align: left; font-size: 13.5px; border: 1px solid rgba(255,42,109,0.15)">
                        <strong style="color: #ff2a6d">📌 Sugestão Atual:</strong><br><br>
                        📅 Data/Hora: ${dFormat} às ${propostaPrincipalSalva.time}<br>
                        🍕 Comida/Bebida: ${propostaPrincipalSalva.food}<br>
                        🎸 Vibe: ${propostaPrincipalSalva.activity}
                    </div>
                    <div style="font-weight: bold; font-size: 14px; color: #fff; margin-top: 10px;">O que você acha da proposta?</div>
                `;
            }

            document.getElementById('container-botoes-votacao').innerHTML = `
                <button class="btn-vote-sim" onclick="votarGrupoSim()" style="background:#ff2a6d; color:white; border:none; padding:14px 20px; border-radius:50px; font-weight:bold; cursor:pointer; font-size:12px;">FECHADO! TOPO 💙</button>
                <button class="btn-vote-nao" onclick="votarGrupoNao()" style="background:#250f31; color:white; border:1px solid rgba(255,42,109,0.3); padding:14px 20px; border-radius:50px; font-weight:bold; cursor:pointer; font-size:12px;">MUDAR DETALHES 🗺️</button>
            `;
        }

        function votarGrupoSim() {
            const payload = {
                nomeParticipante: nomeDoParticipanteAtual,
                votoConcorda: true,
                sugestaoAlternativa: 'Aprovou a sugestão base',
                ehPropostaBase: false,
                date: propostaPrincipalSalva ? propostaPrincipalSalva.date : '',
                time: propostaPrincipalSalva ? propostaPrincipalSalva.time : '',
                food: propostaPrincipalSalva ? propostaPrincipalSalva.food : '',
                activity: propostaPrincipalSalva ? propostaPrincipalSalva.activity : ''
            };

            document.getElementById('status-texto').innerText = "Computando voto...";

            fetch(`/api/salvar-date/${idConvite}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.sucesso) {
                    alert('Seu voto positivo foi computado no grupo!');
                    document.getElementById('sum-date').innerText = payload.date.split('-').reverse().join('/');
                    document.getElementById('sum-time').innerText = payload.time;
                    document.getElementById('sum-food').innerText = payload.food;
                    document.getElementById('sum-activity').innerText = payload.activity;
                    nextScreen(6);
                } else {
                    alert('Erro ao registrar voto.');
                }
            }).catch(err => console.error("Erro na votação:", err));
        }

        function votarGrupoNao() {
            alert('Vamos montar sua contraproposta! Selecione a nova data/horário nos campos a seguir.');
            nextScreen(3); 
            setTimeout(() => {
                const dateInput = document.getElementById('date-input');
                if(dateInput) dateInput.focus();
            }, 400);
        }

        function aplicarConfiguracaoOcasiao(ocasiao) {
            const config = configuracoesOcasiao[ocasiao] || configuracoesOcasiao['date'];

            if (configTipoConvite !== 'grupo') {
                document.getElementById('titulo-dinamico').innerText = `${nomeDonoDoLink} ${config.tituloTela1}`;
            }
            document.getElementById('emoji-tela1').innerText = config.emojiTela1;
            document.getElementById('emoji-tela2').innerText = config.emojiTela2;

            document.getElementById('titulo-tela4').innerText = config.tituloTela4;
            renderizarGrid('grid-comida', config.comidas, 'food');

            document.getElementById('titulo-tela5').innerText = config.tituloTela5;
            renderizarGrid('grid-atividade', config.atividades, 'activity');

            document.getElementById('emoji-final').innerText = config.emojiFinal;
            document.getElementById('titulo-final').innerText = config.tituloFinal;
            document.getElementById('subtitulo-final').innerText = config.subtituloFinal;
        }

        function renderizarGrid(elementId, itens, tipo) {
            const grid = document.getElementById(elementId);
            if (!grid) return;
            grid.innerHTML = '';
            itens.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = 'option-box';
                box.setAttribute('data-tipo', tipo);
                box.setAttribute('data-label', item.label);
                box.onclick = () => alternarSelecaoItem(box, tipo, item.label);
                
                box.innerHTML = `
                    <span style="font-size: 24px;">${item.icon}</span>
                    <span style="font-size: 12px; font-weight: bold;">${item.label}</span>
                `;
                grid.appendChild(box);
            });
        }

        function alternarSelecaoItem(elemento, tipo, label) {
            elemento.classList.toggle('selected');
            const arr = tipo === 'food' ? selectedFoods : selectedActivities;
            const index = arr.indexOf(label);
            
            if (index > -1) {
                arr.splice(index, 1);
            } else {
                arr.push(label);
            }

            if (label === 'Outros') {
                const containerId = tipo === 'food' ? 'campo-outros-comida' : 'campo-outros-vibe';
                const targetInput = document.getElementById(containerId);
                if(targetInput) targetInput.style.display = elemento.classList.contains('selected') ? 'block' : 'none';
            }
        }

        function validateScreen3() {
            const dateVal = document.getElementById('date-input').value;
            const timeVal = document.getElementById('time-input').value;
            
            if (!dateVal || !timeVal) {
                alert('Por favor, preencha a data e o horário desejados!');
                return;
            }
            
            dateSelections.date = dateVal;
            dateSelections.time = timeVal;
            
            const [ano, mes, dia] = dateVal.split('-');
            document.getElementById('sum-date').innerText = `${dia}/${mes}/${ano}`;
            document.getElementById('sum-time').innerText = timeVal;
            
            nextScreen(4);
        }

        function validateScreen4() {
            if (selectedFoods.length === 0) {
                alert('Selecione ao menos uma opção gastronômica!');
                return;
            }
            
            let displayTexto = [...selectedFoods];
            if (selectedFoods.includes('Outros')) {
                const extra = document.getElementById('comida-outros-input').value.trim();
                if (extra) {
                    displayTexto[displayTexto.indexOf('Outros')] = extra;
                }
            }
            
            dateSelections.food = displayTexto.join(', ');
            document.getElementById('sum-food').innerText = dateSelections.food;
            nextScreen(5);
        }

        function validateScreen5() {
            if (selectedActivities.length === 0) {
                alert('Selecione ao menos uma vibe para o rolê!');
                return;
            }
            
            let displayTexto = [...selectedActivities];
            if (selectedActivities.includes('Outros')) {
                const extra = document.getElementById('vibe-outros-input').value.trim();
                if (extra) {
                    displayTexto[displayTexto.indexOf('Outros')] = extra;
                }
            }
            
            dateSelections.activity = displayTexto.join(', ');
            document.getElementById('sum-activity').innerText = dateSelections.activity;
            nextScreen(6);
        }

        function criarEventoAgenda() {
            const dataString = dateSelections.date.replace(/-/g, '');
            const horaString = dateSelections.time.replace(/:/g, '') + '00';
            const config = configuracoesOcasiao[tipoOcasiao] || configuracoesOcasiao['date'];
            const tituloEvento = `Compromisso: ${config.tituloFinal}`;
            
            const icsConteudo = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "BEGIN:VEVENT",
                `DTSTART:${dataString}T${horaString}`,
                `DTEND:${dataString}T${parseInt(dateSelections.time.split(':')[0]) + 2}${dateSelections.time.split(':')[1]}00`,
                `SUMMARY:${tituloEvento}`,
                `DESCRIPTION:Cardápio sugerido: ${dateSelections.food} | Vibe: ${dateSelections.activity}`,
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\n");
            
            const blob = new Blob([icsConteudo], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'evento-role.ics';
            link.click();
        }

        function enviarDadosBackend() {
            const statusBox = document.getElementById('status-texto');
            if(statusBox) statusBox.innerText = "Enviando dados finais...";

            const defineComoBase = ehPrimeiroAcessoGrupo;

            const payload = {
                // CORREÇÃO: Envia o nome real do participante digitado na tela inicial
                nomeParticipante: nomeDoParticipanteAtual || 'Convidado Individual',
                votoConcorda: ehPrimeiroAcessoGrupo, 
                sugestaoAlternativa: ehPrimeiroAcessoGrupo ? 'Criou a Proposta Base' : 'Enviou uma Contraproposta alternativa',
                ehPropostaBase: defineComoBase,
                date: dateSelections.date,
                time: dateSelections.time,
                food: dateSelections.food,
                activity: dateSelections.activity
            };

            const endpoint = idConvite ? `/api/salvar-date/${idConvite}` : '/api/salvar-date';

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(statusBox) statusBox.innerText = "Sucesso! Redirecionando para o WhatsApp...";
                abrirJanelaWhatsApp();
            })
            .catch(err => {
                console.error(err);
                if(statusBox) statusBox.innerText = "Erro no servidor. Tentando enviar via WhatsApp diretamente...";
                abrirJanelaWhatsApp();
            });
        }

        function abrirJanelaWhatsApp() {
            const config = configuracoesOcasiao[tipoOcasiao] || configuracoesOcasiao['date'];
            
            let headlineWhats = config.textoWhats;
            if (configTipoConvite === 'grupo') {
                headlineWhats = ehPrimeiroAcessoGrupo ? 'Criei a sugestão inicial do nosso rolê em grupo! 🚀' : 'Enviei uma contraproposta para o rolê do grupo! 🔄';
            }

            const identificador = configTipoConvite === 'grupo' ? `Fui eu, o(a) *${nomeDoParticipanteAtual}*` : `Fui eu, o(a) *${nomeDoParticipanteAtual}*`;
            const textoFormatado = 
                `*${headlineWhats}*\n\n` +
                `👤 ${identificador}\n` +
                `📅 Data: ${document.getElementById('sum-date').innerText}\n` +
                `⏰ Horário: ${dateSelections.time}\n` +
                `🍽️ O que comer: ${dateSelections.food}\n` +
                `✨ Vibe do rolê: ${dateSelections.activity}`;

            const numeroComDdd = whatsappCriadorLink.replace(/\D/g, '');
            const urlWhats = numeroComDdd 
                ? `https://api.whatsapp.com/send?phone=${numeroComDdd}&text=${encodeURIComponent(textoFormatado)}`
                : `https://api.whatsapp.com/send?text=${encodeURIComponent(textoFormatado)}`;
            
            window.open(urlWhats, '_blank');
        }

        function initCoracoesNoBackground() {
            const bg = document.getElementById('hearts-bg');
            if(!bg) return;
            const emojis = ['❤️', '💖', '✨', '🌹', '🎵'];
            
            setInterval(() => {
                if (document.hidden) return; 
                
                const heart = document.createElement('div');
                heart.className = 'heart-icon';
                heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = Math.floor(Math.random() * 16) + 12 + 'px';
                heart.style.animationDuration = Math.random() * 4 + 5 + 's';
                
                bg.appendChild(heart);
                setTimeout(() => heart.remove(), 8000);
            }, 700);
        }

        initCoracoesNoBackground();
    </script>
</body>
</html>
