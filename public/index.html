<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial</title>

    <style>
        /* =======================================================
           VARIÁVEIS GLOBAIS DE TEMA
        ======================================================= */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f051d 0%, #19062a 100%);
            --primary-color: #ff2a74;
            --primary-hover: #e0165c;
            --secondary-bg: rgba(255,255,255,0.05);
            --text-color: #ffffff;
            --text-muted: #b5a4be;
            --card-bg: rgba(23,11,39,0.60);
            --border-color: rgba(255,255,255,0.08);
        }

        /* =======================================================
           RESET GLOBAL
        ======================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* =======================================================
           FUNDO ANIMADO
        ======================================================= */
        #hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart-icon {
            position: absolute;
            bottom: -20px;
            opacity: 0.30;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: .4; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* =======================================================
           CONTAINER PRINCIPAL
        ======================================================= */
        .container {
            width: 100%;
            max-width: 420px;
            min-height: 600px;
            padding: 20px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* =======================================================
           TELAS
        ======================================================= */
        .screen {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 35px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.50);
            position: relative;
        }

        .screen.active {
            display: block;
            animation: fadeIn .4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =======================================================
           TÍTULOS E COMPONENTES
        ======================================================= */
        .emoji-header {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        h2 {
            font-size: 1.5rem;
            line-height: 1.3;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: .95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.10);
            background: rgba(255,255,255,.06);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color .2s;
        }

        .input-field:focus { border-color: var(--primary-color); }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 50px;
            background: var(--primary-color);
            color: white;
            font-size: .95rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background .2s, transform .1s;
            box-shadow: 0 4px 15px rgba(255,42,116,.30);
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(.98); }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,.2);
            box-shadow: none;
        }

        /* Listas de Resumo da sua index */
        .resumo-box {
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
        }
        .resumo-item {
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <div id="hearts-bg"></div>

    <div class="container">
        <div id="screen-recepcao" class="screen active">
            <div class="emoji-header" id="recepcao-emoji">✨</div>
            <h2 id="titulo-dinamico">Carregando convite...</h2>
            <p id="subtitulo-dinamico">Preparando ambiente especial...</p>
            
            <div id="wrapper-input-nome" class="input-group" style="display: none;">
                <label>Seu Nome</label>
                <input type="text" id="nome-visitante-grupo" class="input-field" placeholder="Ex: Carol">
            </div>

            <div id="container-botoes-tela1">
                </div>
        </div>

        <div id="screen-escolhas" class="screen">
            <div class="emoji-header">📅</div>
            <h2>Ajustar preferências</h2>
            <p>Selecione os detalhes ideais para você:</p>
            
            <div class="input-group">
                <label>Escolha o Dia</label>
                <input type="date" id="select-date" class="input-field">
            </div>
            <div class="input-group">
                <label>Escolha o Horário</label>
                <input type="time" id="select-time" class="input-field">
            </div>
            
            <button class="btn" id="btn-avancar-fluxo-padrao" onclick="capturarEAvancar()">Confirmar Opções 🚀</button>
        </div>

        <div id="screen-sucesso" class="screen">
            <div class="emoji-header">🎉</div>
            <h2>Tudo Pronto!</h2>
            <p id="status-texto">Salvando informações...</p>

            <div class="resumo-box">
                <div class="resumo-item">🗓️ <strong>Data:</strong> <span id="sum-date">--</span></div>
                <div class="resumo-item">⏰ <strong>Horário:</strong> <span id="sum-time">--</span></div>
                <div class="resumo-item">🍽️ <strong>Comidas/Bebidas:</strong> <span id="sum-food">--</span></div>
                <div class="resumo-item">✨ <strong>Vibe:</strong> <span id="sum-activity">--</span></div>
            </div>

            <button class="btn" onclick="abrirJanelaWhatsApp()" style="background-color: #25D366; box-shadow: 0 4px 12px rgba(37,211,102,0.3);">
                📲 Enviar por WhatsApp
            </button>
            <button class="btn btn-outline" onclick="criarEventoAgenda()" style="margin-top: 12px;">
                📅 Salvar na Minha Agenda
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // VARIÁVEIS GLOBAIS REUTILIZADAS DO SEU PROJETO
        // ==========================================
        let idConvite = new URLSearchParams(window.location.search).get('id') || window.location.pathname.split('/').pop();
        let nomeDonoDoLink = 'Alguém';
        let tipoOcasiao = 'date';
        let configTipoConvite = 'individual';
        let whatsappCriadorLink = '';
        let tituloPersonalizado = '';
        let nomeDoParticipanteAtual = 'Convidado Individual';
        let ehPrimeiroAcessoGrupo = false;

        let dateSelections = {
            date: '',
            time: '',
            food: 'Carregando...',
            activity: 'Carregando...'
        };

        const configuracoesOcasiao = {
            'date': { emojis: ['❤️', '💖', '🌹', '✨'], textoWhats: 'Aceitei seu convite para o nosso Date! 🌹' },
            'resenha': { emojis: ['🍻', '🔥', '🎵', '🍕'], textoWhats: 'Bora pra resenha! Presença confirmada! 🍻' },
            'girls-night': { emojis: ['💅', '💖', '✨', '🥂'], textoWhats: 'Noite das meninas! Confirmadíssima! 💅' },
            'outros': { emojis: ['🎉', '✨', '🎳', '🌟'], textoWhats: 'Rolê Confirmado! Já estou ansioso(a)! ✨' }
        };

        function nextScreen(screenIndex) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            if(screenIndex === 0) document.getElementById('screen-recepcao').classList.add('active');
            if(screenIndex === 1) document.getElementById('screen-escolhas').classList.add('active');
            if(screenIndex === 2) document.getElementById('screen-sucesso').classList.add('active');
        }

        // ==========================================
        // TELA INICIAL DO CONVITE INDIVIDUAL
        // ==========================================
        function configurarConviteIndividual() {
            nextScreen(0);

            document.getElementById('titulo-dinamico').innerHTML =
                `${nomeDonoDoLink} te convidou para:<br><br><strong>${tituloPersonalizado || 'Um momento especial ✨'}</strong><br><br>Você aceita?`;

            document.getElementById('subtitulo-dinamico').innerText = 'Só existe uma resposta correta. 😏';
            document.getElementById('wrapper-input-nome').style.display = 'none';

            document.getElementById('container-botoes-tela1').innerHTML = `
                <button class="btn" onclick="aceitarConvite()">SIM 💖</button>
                <button id="btn-fugitivo" class="btn btn-outline" style="margin-top:12px; position:relative;">NÃO 😅</button>
            `;
            iniciarBotaoFugitivo();
        }

        function configurarInterfaceGrupo() {
            nextScreen(0);
            document.getElementById('recepcao-emoji').innerText = "👥";
            document.getElementById('titulo-dinamico').innerHTML = `VOTAÇÃO DO GRUPO ATIVA! 🔥`;
            document.getElementById('subtitulo-dinamico').innerText = `${nomeDonoDoLink} criou uma proposta. Digite seu nome para entrar:`;
            document.getElementById('wrapper-input-nome').style.display = 'block';

            document.getElementById('container-botoes-tela1').innerHTML = `
                <button class="btn" onclick="aceitarGrupo()">Entrar e Votar 🚀</button>
            `;
        }

        // ==========================================
        // BOTÃO NÃO FUGITIVO (ORIGINAL)
        // ==========================================
        function iniciarBotaoFugitivo() {
            const btn = document.getElementById('btn-fugitivo');
            if (!btn) return;
            btn.addEventListener('mouseenter', fugir);
            btn.addEventListener('touchstart', fugir);

            function fugir() {
                const x = Math.random() * 180 - 90;
                const y = Math.random() * 120 - 60;
                btn.style.transform = `translate(${x}px, ${y}px)`;
            }
        }

        function aceitarConvite() {
            // Seta os padrões recebidos do criador
            atualizarResumoFinal();
            nextScreen(1); // Vai para tela de refinar data/hora se o usuário quiser mudar
        }

        function aceitarGrupo() {
            const inputNome = document.getElementById('nome-visitante-grupo');
            if(!inputNome || !inputNome.value.trim()) return alert("Por favor, digite seu nome primeiro! 😉");
            nomeDoParticipanteAtual = inputNome.value.trim();
            atualizarResumoFinal();
            nextScreen(1);
        }

        function capturarEAvancar() {
            const d = document.getElementById('select-date').value;
            const t = document.getElementById('select-time').value;
            
            if(d) dateSelections.date = d;
            if(t) dateSelections.time = t;

            nextScreen(2);
            atualizarResumoFinal();
            enviarDadosBackend();
        }

        // ==========================================
        // CARREGAMENTO DO CONVITE (SINCRONIZADO)
        // ==========================================
        if (idConvite && idConvite !== 'index.html') {
            fetch(`/api/convite/${idConvite}`)
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso) {
                        const convite = data.convite;
                        nomeDonoDoLink = convite.nomeCriador || 'Alguém';
                        tipoOcasiao = convite.ocasiao || 'date';
                        configTipoConvite = convite.tipoConvite || 'individual';
                        whatsappCriadorLink = convite.whatsappCriador || '';
                        tituloPersonalizado = convite.ocasiao; 

                        // Preenche as seleções dinâmicas herdadas do backend
                        dateSelections.food = convite.sugestaoAtual.comidaBebida;
                        dateSelections.activity = convite.sugestaoAtual.vibe;
                        
                        // Quebra a string "DD/MM/AAAA às HH:MM" se possível
                        if(convite.sugestaoAtual.dataHora.includes(' às ')) {
                            const partes = convite.sugestaoAtual.dataHora.split(' às ');
                            dateSelections.date = partes[0];
                            dateSelections.time = partes[1];
                        } else {
                            dateSelections.date = convite.sugestaoAtual.dataHora;
                        }

                        if (configTipoConvite === 'grupo') {
                            configurarInterfaceGrupo();
                        } else {
                            configurarConviteIndividual();
                        }
                        initCoracoesNoBackground();
                    }
                })
                .catch(err => {
                    console.error(err);
                    configurarConviteIndividual();
                });
        }

        // ======================================================
        // ABRIR WHATSAPP (ORIGINAL ATUALIZADO)
        // ======================================================
        function abrirJanelaWhatsApp() {
            const config = configuracoesOcasiao[tipoOcasiao] || configuracoesOcasiao['date'];
            let tituloMensagem = config.textoWhats;

            if (configTipoConvite === 'grupo') {
                tituloMensagem = 'Enviei minha resposta para o grupo! 🔥';
            }

            const participanteTexto = configTipoConvite === 'grupo'
                ? `👤 Participante: ${nomeDoParticipanteAtual}`
                : `👤 Convidado(a): Aceitou o convite ❤️`;

            const mensagem = `${tituloMensagem}\n\n${participanteTexto}\n\n📅 Data: ${document.getElementById('sum-date').innerText}\n⏰ Horário: ${dateSelections.time}\n\n🍽️ Comidas/Bebidas:\n${dateSelections.food}\n\n✨ Vibe:\n${dateSelections.activity}`;

            if (configTipoConvite === 'individual' && whatsappCriadorLink) {
                const numero = whatsappCriadorLink.replace(/\D/g, '');
                window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${encodeURIComponent(mensagem)}`, '_blank');
                return;
            }

            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`, '_blank');
        }

        // ======================================================
        // SALVAR EVENTO NA AGENDA (ORIGINAL)
        // ======================================================
        function criarEventoAgenda() {
            if (!dateSelections.date) {
                alert('Escolha uma data primeiro.');
                return;
            }

            // Fallback caso a data seja uma string BR (DD/MM/AAAA)
            let dataStr = dateSelections.date;
            if(dataStr.includes('/')) {
                const p = dataStr.split('/');
                dataStr = `${p[2]}-${p[1]}-${p[0]}`;
            }

            const horaStr = dateSelections.time && dateSelections.time !== 'A combinar' ? dateSelections.time : "20:00";
            const dataInicio = new Date(`${dataStr}T${horaStr}:00`);
            const dataFim = new Date(dataInicio.getTime() + (3 * 60 * 60 * 1000));

            function formatICS(data) {
                try {
                    return data.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                } catch(e) {
                    return "20260705T200000Z";
                }
            }

            const tituloEvento = `Rolê Especial com ${nomeDonoDoLink} ✨`;
            const descricao = `Comidas:\n${dateSelections.food}\n\nVibe:\n${dateSelections.activity}`;

            const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${tituloEvento}\nDESCRIPTION:${descricao}\nDTSTART:${formatICS(dataInicio)}\nDTEND:${formatICS(dataFim)}\nEND:VEVENT\nEND:VCALENDAR`;

            const blob = new Blob([ics], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'evento.ics';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ======================================================
        // ENVIAR DADOS PARA O BACKEND (CORRIGIDO PARA AS NOVAS ROTAS)
        // ======================================================
        function enviarDadosBackend() {
            const statusBox = document.getElementById('status-texto');
            statusBox.innerText = 'Salvando informações...';

            let dataHoraFinal = dateSelections.date;
            if(dateSelections.time) dataHoraFinal += ` às ${dateSelections.time}`;

            const payload = {
                nome: nomeDoParticipanteAtual,
                status: configTipoConvite === 'grupo' ? 'Votou no Rolê 💙' : 'Aceitou o Convite 💖',
                contraproposta: {
                    dataHora: dataHoraFinal,
                    comidaBebida: dateSelections.food,
                    vibe: dateSelections.activity
                }
            };

            // Rota atualizada e unificada do seu server.js
            fetch(`/api/convite/${idConvite}/responder`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(() => {
                statusBox.innerText = '✅ Informações salvas com sucesso!';
            })
            .catch(() => {
                statusBox.innerText = '⚠️ Não foi possível salvar no servidor, mas você pode compartilhar.';
            });
        }

        // ======================================================
        // ANIMAÇÃO DE FUNDO (EMOJIS SELECIONÁVEIS ORIGINAIS)
        // ======================================================
        function initCoracoesNoBackground() {
            const bg = document.getElementById('hearts-bg');
            if (!bg) return;

            let emojis = ['❤️', '💖', '✨'];
            const config = configuracoesOcasiao[tipoOcasiao] || configuracoesOcasiao['outros'];
            emojis = config.emojis;

            setInterval(() => {
                if (document.hidden) return;
                const item = document.createElement('div');
                item.className = 'heart-icon';
                item.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                item.style.left = Math.random() * 100 + '%';
                item.style.fontSize = (Math.random() * 18 + 12) + 'px';
                item.style.animationDuration = (Math.random() * 4 + 6) + 's';
                bg.appendChild(item);

                setTimeout(() => { item.remove(); }, 9000);
            }, 900);
        }

        // ======================================================
        // AJUSTES FINAIS DA TELA FINAL
        // ======================================================
        function atualizarResumoFinal() {
            let dataExibicao = dateSelections.date;
            if(dataExibicao && dataExibicao.includes('-')) {
                dataExibicao = dataExibicao.split('-').reverse().join('/');
            }

            document.getElementById('sum-date').innerText = dataExibicao || 'A combinar';
            document.getElementById('sum-time').innerText = dateSelections.time || 'A combinar';
            document.getElementById('sum-food').innerText = dateSelections.food || '--';
            document.getElementById('sum-activity').innerText = dateSelections.activity || '--';
        }
    </script>
</body>
</html>
